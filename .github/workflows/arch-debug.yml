name: AyuGram Remote - Arch Linux Debug

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-debug:
    name: Arch Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    container:
      image: archlinux:base-devel

    steps:
      - name: Install Arch Linux dependencies
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja python \
            python-packaging pkgconf gperf \
            qt6-base qt6-declarative qt6-svg \
            qt6-wayland qt6-imageformats \
            qt6-shadertools qt6-tools \
            openssl ffmpeg libtg_owt \
            tlottie rnnoise openal hunspell \
            libavif libheif libjxl lz4 minizip \
            abseil-cpp kcoreaddons libfido2 \
            libx11 libxcb libxrandr libxext \
            libxdamage libxcomposite libxfixes \
            libxtst libxkbcommon wayland \
            pipewire libpipewire \
            vulkan-headers cairo pango fontconfig \
            zlib xxhash range-v3 tl-expected \
            microsoft-gsl boost boost-libs \
            gobject-introspection glib2-devel \
            protobuf ada rust

      - name: Checkout AyuGram Remote
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Fix Git safe directories
        shell: bash
        run: |
          while IFS= read -r marker; do
            git config --global --add safe.directory "$(dirname "$marker")"
          done < <(find "$GITHUB_WORKSPACE" -name .git -print -prune)
          git status --short

      - name: System information
        shell: bash
        run: |
          cat /etc/os-release
          uname -m
          cmake --version
          gcc --version | head -n 1
          git submodule status | tail -n 15

      - name: Build and install tde2e
        shell: bash
        run: |
          git init /tmp/td-e2e
          git -C /tmp/td-e2e remote add origin https://github.com/tdlib/td.git
          git -C /tmp/td-e2e fetch --depth=1 origin 51743dfd01dff6179e2d8f7095729caa4e2222e9
          git -C /tmp/td-e2e checkout --detach FETCH_HEAD

          cmake -S /tmp/td-e2e -B /tmp/td-e2e-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DTD_E2E_ONLY=ON \
            -DTD_INSTALL_STATIC_LIBRARIES=ON \
            -DBUILD_TESTING=OFF

          cmake --build /tmp/td-e2e-build --parallel 2
          cmake --install /tmp/td-e2e-build

          echo "========== VERIFY TDE2E =========="
          find /usr/lib/cmake/tde2e -type f
          test -f /usr/lib/cmake/tde2e/tde2eConfig.cmake

      - name: Configure Debug
        shell: bash
        run: |
          cmake -S . -B out -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS_DEBUG="-O0 -g0" \
            -DCMAKE_CXX_FLAGS_DEBUG="-O0 -g0" \
            -DDESKTOP_APP_USE_PACKAGED=ON \
            -DTDESKTOP_API_ID=2040 \
            -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Show build targets
        shell: bash
        run: |
          ninja -C out -t targets all | grep -Ei \
            '(^Telegram:|remote|server)' | head -n 60 || true

      - name: Build AyuGram Debug
        shell: bash
        run: |
          cmake --build out --target Telegram --parallel 2

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p artifacts
          find out -type f -name Telegram -executable \
            -exec cp {} artifacts/ \;
          test -s artifacts/Telegram
          file artifacts/Telegram

      - name: Upload Arch Linux build
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Remote-ArchLinux-Debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
